<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/sign-up/login.css">
    
</head>
<body>
    

    <div class="container">

    <div class="left">
        <h1>Welcome to ToyTown 🧸</h1>
        <p>Premium Quality Kids Toys</p>
    </div>

    <div class="right">

        <!-- LOGIN -->
        <div class="form-box active" id="loginForm">
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="login()">Login</button>
            <div class="toggle" onclick="showSignup()">Don't have account? <a href="register.html"><span>Sign Up</span></a></div>
        </div>



    </div>
</div>




<script src="/sign-up/login.js" ></script>
</body>
</html>
