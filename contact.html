<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive contact us page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./css/contact.css">
</head>
<body>
    <section class="contact">
        <div class="container">
            <h2 style="text-align: center;">Contact Us</h2>
            <div class="row">
                <div class="col-8 mx-auto">
            <div class="contact-wrapper">
                <div class="contact-form">
                    <h3>Send us a message</h3>
                    <form id="myform">
                        <div class="form-group">
                            <input type="text" name="name" id="name" placeholder="Enter Your Name" class="form-control mt-3" id="name" pattern="[a-zA-Z\s]{3,}">
                            <span></span>
                        </div>
                         <div class="form-group">
                            <input type="email" name="email" id="email" placeholder="Enter Your Email" class="form-control mt-3" id="email"pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{3,}">
                            <span></span>
                        </div>
                         <div class="form-group">
                            <textarea name="message" id="message" placeholder="Enter Your Message" class="form-control mt-3" id="message"></textarea>
                            <span></span>
                        </div>
                        <button type="submit">Send Message</button>
                    </form>
                </div>
                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <p><i class="fas fa-phone"></i>+1 123 45
                        6 789</p>
                    <p><i class="fas fa-envelope"></i>info@example.com</p>
                </div>
                </div>
            </div>
            </div>
        </div>

    <h1 class="text-center mt-3 mb-4" style="margin-bottom: 20px;">Get location</h1>

    <div class="container">
        <div class="row">
            <div class="col-12">
                <button id="getLocationBtn" class="btn btn-warning d-block mx-auto mt-4" style="margin-bottom: 30px;" onclick="showLocation()">Get my Location</button>

                <div class="map-container mt-4" id="map" style="width: 100%; height: 500px; margin: auto 20px;">

                </div>

            </div>
        </div>
    </div>



    <!-- <script src="./new.js"></script> -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./new.js"></script>


  </body>
</html>
    </section>
    <script src="./js/contact.js"></script>
</body>
</html>
